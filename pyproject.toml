[build-system]
requires = ["setuptools>=61.0,<75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nrl-tracker"
version = "1.16.0"
description = "Python port of the U.S. Naval Research Laboratory's Tracker Component Library for target tracking algorithms"
readme = "README.md"
authors = [
    {name = "Original: David F. Crouse, Naval Research Laboratory"},
]
maintainers = [
    {name = "Python Port Contributors"},
]
keywords = [
    "tracking",
    "kalman-filter",
    "target-tracking",
    "data-association",
    "estimation",
    "navigation",
    "coordinate-systems",
    "signal-processing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: Public Domain",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Astronomy",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "numba>=0.57.0",
    "h5py>=3.8.0",
]

[project.optional-dependencies]
astronomy = [
    "astropy>=5.0",
    "jplephem>=2.18",
]
geodesy = [
    "pyproj>=3.4.0",
    "geographiclib>=2.0",
]
visualization = [
    "plotly>=5.15.0",
]
optimization = [
    "cvxpy>=1.3.0",
]
terrain = [
    "netCDF4>=1.6.0",
]
signal = [
    "pywavelets>=1.4.0",
]
gpu = [
    "cupy-cuda12x>=12.0.0",
]
gpu-apple = [
    "mlx>=0.16.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "pytest-benchmark>=4.0.0",
    "pytest-timeout>=2.0.0",
    "nbval>=0.10.0",
    "hypothesis>=6.0.0",
    "ruff>=0.16.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "sphinx>=6.0.0",
    "sphinx-rtd-theme>=1.2.0",
    "myst-parser>=1.0.0",
    "nbsphinx>=0.9.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
]
benchmark = [
    "pytest-benchmark>=4.0.0",
]
all = [
    "nrl-tracker[astronomy,geodesy,terrain,visualization,optimization,signal,dev]",
]

[project.urls]
"Homepage" = "https://pytcl.readthedocs.io/en"
"Documentation" = "https://pytcl.readthedocs.io/en/latest/docs.html"
"Repository" = "https://github.com/nedonatelli/TCL"
"Bug Tracker" = "https://github.com/nedonatelli/TCL/issues"
"Original MATLAB Library" = "https://github.com/USNavalResearchLaboratory/TrackerComponentLibrary"

[tool.setuptools.packages.find]
where = ["."]
include = ["pytcl*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "matlab_validated: tests validated against MATLAB reference output",
    "benchmark: marks tests as benchmarks",
    "light: marks benchmark as part of light (PR) suite",
    "full: marks benchmark as part of full (main) suite",
    "notebook: marks notebook validation tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["pytcl"]
branch = true
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["build", "dist", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"examples/*.py" = ["F401", "F541", "F841", "E402", "E731"]
"docs/examples/*.py" = ["F401", "F541", "F841", "E402", "E731"]
"docs/tutorials/*.py" = ["F401", "F541", "F841", "E402", "E731"]

[tool.ruff.lint.isort]
known-first-party = ["pytcl"]

# Note: mypy config lives in mypy.ini
