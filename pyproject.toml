[build-system]
requires = ["setuptools>=61.0,<75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nrl-tracker"
version = "2.0.0"
description = "Python port of the U.S. Naval Research Laboratory's Tracker Component Library for target tracking algorithms"
readme = "README.md"
authors = [
    {name = "Original: David F. Crouse, Naval Research Laboratory"},
]
maintainers = [
    {name = "Python Port Contributors"},
]
keywords = [
    "tracking",
    "kalman-filter",
    "target-tracking",
    "data-association",
    "estimation",
    "navigation",
    "coordinate-systems",
    "signal-processing",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: Public Domain",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Astronomy",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "numba>=0.57.0",
    "h5py>=3.8.0",
]

[project.optional-dependencies]
astronomy = [
    "astropy>=5.0",
    "jplephem>=2.18",
    # reference oracle for the SGP4 tests; without it they skip silently
    "sgp4>=2.20",
]
geodesy = [
    "pyproj>=3.4.0",
    # reference oracle for the navigation validation tests
    "geographiclib>=2.0",
]
visualization = [
    "plotly>=5.15.0",
]
terrain = [
    "netCDF4>=1.6.0",
]
signal = [
    "pywavelets>=1.4.0",
]
gpu = [
    "cupy-cuda12x>=12.0.0",
    # CUDA 12 runtime libraries as pip wheels (CuPy >= 13 discovers them in
    # site-packages). Without these, cupy-cuda12x fails with ImportError
    # (libcublas.so.12) on hosts whose system CUDA is 13.x, and NVRTC < 12.8
    # cannot JIT kernels for Blackwell (sm_120) GPUs. Verified 2026-08-09 on
    # a CUDA 13.0 / RTX 5090 host: all 85 CuPy-gated tests pass with these,
    # fail without. Linux-only wheels; Windows CUDA users rely on a system
    # CUDA 12.8+ toolkit as before.
    "nvidia-cublas-cu12>=12.8; platform_system == 'Linux'",
    "nvidia-cusolver-cu12>=11.7; platform_system == 'Linux'",
    "nvidia-cufft-cu12>=11.3; platform_system == 'Linux'",
    "nvidia-curand-cu12>=10.3.9; platform_system == 'Linux'",
    "nvidia-cusparse-cu12>=12.5.8; platform_system == 'Linux'",
    "nvidia-nvjitlink-cu12>=12.8; platform_system == 'Linux'",
    "nvidia-cuda-nvrtc-cu12>=12.8; platform_system == 'Linux'",
    "nvidia-cuda-runtime-cu12>=12.8; platform_system == 'Linux'",
]
gpu-apple = [
    "mlx>=0.16.0",
]
all = [
    "nrl-tracker[astronomy,geodesy,terrain,visualization,signal]",
]

[project.urls]
"Homepage" = "https://pytcl.readthedocs.io/en"
"Documentation" = "https://pytcl.readthedocs.io/en/latest/docs.html"
"Repository" = "https://github.com/nedonatelli/TCL"
"Bug Tracker" = "https://github.com/nedonatelli/TCL/issues"
"Original MATLAB Library" = "https://github.com/USNavalResearchLaboratory/TrackerComponentLibrary"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "pytest-benchmark>=4.0.0",
    "pytest-timeout>=2.0.0",
    "nbval>=0.10.0",
    "hypothesis>=6.0.0",
    # The docs code-block gate (tests/contract/test_docs_code_blocks.py) runs
    # every docs page under a forced Agg backend; several pages plot with
    # matplotlib, and without it 36 pages skip and the gate's own self-tests
    # fail. The notebooks also import it.
    "matplotlib>=3.7",
    # examples/multi_target_tracking_rerun.py logs to a Rerun recording; the
    # examples contract test runs every script with the project interpreter,
    # so the SDK must be importable here (end users get it via the script's
    # PEP 723 inline metadata instead).
    "rerun-sdk>=0.24",
    "ruff>=0.16.0",
    "mypy>=1.0.0",
    "ty>=0.0.69",
    "prek>=0.4",
    "sphinx>=6.0.0",
    "sphinx-rtd-theme>=1.2.0",
    "myst-parser>=1.0.0",
    "nbsphinx>=0.9.0",
    "sphinxcontrib-mermaid>=0.9.2",
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
]

# Extra oracles for tests/validation that are too heavy or too network-bound
# to sit in dev: satkit downloads EOP/space-weather data at runtime. Not
# installed by default -- `uv sync --group validation`; the tests skip
# without it.
validation = [
    "satkit>=0.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pytcl*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "matlab_validated: tests validated against MATLAB reference output",
    "benchmark: marks tests as benchmarks",
    "light: marks benchmark as part of light (PR) suite",
    "full: marks benchmark as part of full (main) suite",
    "notebook: marks notebook validation tests",
    "examples: runs a script from examples/ end to end",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["pytcl"]
branch = true
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["build", "dist", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"examples/*.py" = ["F401", "F541", "F841", "E402", "E731"]
"docs/examples/*.py" = ["F401", "F541", "F841", "E402", "E731"]
"docs/tutorials/*.py" = ["F401", "F541", "F841", "E402", "E731"]

[tool.ruff.lint.isort]
known-first-party = ["pytcl"]

# mypy config lives in mypy.ini; both are retired when the ty probation
# ends in the v2.1.0 release PR (see the 2026-08-06 modernization spec).

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
include = ["pytcl"]

[tool.ty.rules]
# Optional extras (cupy, mlx, plotly, netCDF4, pywavelets, jplephem) aren't
# installed in the dev-group venv; every import site is try/except- or
# is_available()-guarded at runtime. Same as mypy.ini's ignore_missing_imports.
unresolved-import = "ignore"
# numpy's ArrayLike/dtype widening (dtype[floating[Any]] vs dtype[float64],
# List invariance over ArrayLike's union, scalar-or-array duck typing) plus
# attributes on lifecycle-gated Optional handles (DB cursors, HDF5 files,
# tracker state set post-initialize()). Same class of noise mypy.ini
# suppressed via arg-type/index/union-attr/operator/call-overload.
# invalid-assignment and invalid-return-type are deliberately NOT ignored
# here: both caught genuine bugs (wmm.py, wavelets.py, geometry.py) during
# triage, so their remaining hits get per-site ignores instead, keeping the
# rule live for future regressions.
invalid-argument-type = "ignore"
not-subscriptable = "ignore"
unresolved-attribute = "ignore"
unsupported-operator = "ignore"
no-matching-overload = "ignore"
# A few pre-existing bare `# type: ignore` comments suppress mypy-only
# error codes (e.g. list-item) that aren't in ty's model; ty sees them as
# unused. Both tools read the same comment during the mypy/ty probation,
# so ty must not flag it as dead.
unused-type-ignore-comment = "ignore"
