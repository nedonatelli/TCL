name: Publish to PyPI

on:
  release:
    types: [published]
  # Fallback for when GitHub's event delivery drops the release-published
  # webhook (it happened for v2.0.0, during a platform outage): dispatch
  # builds and publishes the named tag directly.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag or ref to build (e.g. v2.0.0)"
        required: true
        type: string
      dry_run:
        description: "Build and verify all distributions but do not publish"
        required: false
        default: false
        type: boolean

# The build jobs only read the repo; the publish job alone adds the
# OIDC token for PyPI trusted publishing.
permissions:
  contents: read

jobs:
  # Since the NRLMSISE-00 extension (csrc/nrlmsise00, built by setup.py)
  # the package ships platform wheels, built by cibuildwheel per OS.
  # The extension targets the stable ABI (abi3, Py_LIMITED_API 3.11),
  # so ONE cp311-abi3 wheel per platform covers every CPython >= 3.11
  # -- including future releases (3.15+) with no workflow change.
  # Linux x86_64 and aarch64 build natively on their own runners (no
  # QEMU); macos-14 builds arm64 only (numba/llvmlite dropped
  # Intel-macOS wheels, and numba is a core dependency, so pytcl
  # cannot run there); windows builds AMD64. Every wheel runs the
  # canonical NRLMSISE-00 check against the compiled backend before
  # it is accepted.
  build_wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2
        env:
          # abi3: build once on the oldest supported CPython; the
          # wheel is tagged cp311-abi3 and serves 3.11+.
          CIBW_BUILD: "cp311-*"
          # musllinux is skipped: scipy/numba wheel coverage there is
          # not dependable, and the import test would source-build.
          CIBW_SKIP: "*-musllinux*"
          # Each runner builds its native arch (the arm64 Linux wheel
          # comes from the ubuntu-24.04-arm runner, not QEMU).
          CIBW_ARCHS: "native"
          # The extension must import and reproduce the reference
          # values, or the wheel is rejected.
          CIBW_TEST_COMMAND: >-
            python -c "from pytcl.atmosphere.nrlmsise00 import nrlmsise00, uses_compiled_backend;
            assert uses_compiled_backend();
            out = nrlmsise00(172, 29000.0, 400.0, 60.0, -70.0, 16.0);
            assert abs(out.t[0] - 1250.5399435607994) < 1e-9"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build_sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist

      - name: Verify the sdist carries the C sources
        run: tar tzf dist/*.tar.gz | grep -q "csrc/nrlmsise00/nrlmsise-00.c"

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    needs: [build_wheels, build_sdist]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    # environment: github
    permissions:
      id-token: write  # For trusted publishing

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List distributions
        run: ls -l dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Uses trusted publishing - configure at pypi.org/manage/project/.../settings/publishing/
