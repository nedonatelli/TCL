name: Publish to PyPI

on:
  release:
    types: [published]
  # Fallback for when GitHub's event delivery drops the release-published
  # webhook (it happened for v2.0.0, during a platform outage): dispatch
  # builds and publishes the named tag directly.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v2.0.0)"
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    # environment: github
    permissions:
      id-token: write  # For trusted publishing

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Uses trusted publishing - configure at pypi.org/manage/project/.../settings/publishing/
