name: CI

on:
  push:
    branches: [main, develop, v2.0.0]
  pull_request:
    branches: [main, v2.0.0]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Check formatting with ruff
        run: uv run ruff format --check .

      - name: Type check with ty
        run: uv run ty check pytcl

  doctests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra all

      - name: Run docstring examples
        # Doctests must not reach the network. A DEEphemeris example without a
        # "# doctest: +SKIP" tries to fetch the 114 MB DE440 kernel from
        # naif.jpl.nasa.gov and hung this job for ten minutes before timing
        # out; the per-test timeout turns any repeat into a fast, clear failure.
        run: uv run pytest --doctest-modules pytcl -q --timeout=60

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
        # Windows on one interpreter, not three. It runs 4-10x slower than the
        # others and sets the critical path, and nothing in the suite branches
        # on sys.platform. The one genuinely Windows-specific risk -- printing
        # a character outside cp1252, which kills a script when stdout is
        # redirected -- is caught by tests/contract/test_console_encoding.py,
        # which parses source with ast and so runs on any platform. This arm
        # exists to catch a pure-Python portability break, and one interpreter
        # is enough for that.
        include:
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # Coverage runs on exactly one job -- the one that uploads it. Measured
      # on this suite, tracing costs 1.77x (81s -> 144s), and the other eight
      # jobs were paying it to produce a report that is thrown away. Those
      # eight run in parallel instead; -n auto is safe here because the suite
      # has no ordering dependence (verified under xdist).
      #
      # The examples marker is excluded and runs in its own job: the scripts
      # are slow and only need exercising on one platform.
      - name: Run tests
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11') }}
        run: uv run pytest tests/ -n auto --benchmark-skip -m "not examples" -q

      # Serial, because coverage under xdist has to merge per-worker data and
      # the gate is not worth the flakiness for one job.
      #
      # NUMBA_DISABLE_JIT=1, as of 2026-08-20: coverage.py cannot trace
      # inside jit-compiled functions, so with JIT on every @njit body
      # counts as unexecuted however thoroughly the tests exercise it --
      # gating.py reported 56% while actually at 94%, and the artifact hid
      # ~50 lines of genuinely dead kernels in rotations.py behind the same
      # number. Compiled behaviour is still verified: every other matrix
      # cell runs the suite with JIT on; only this measurement leg
      # interprets the kernels as Python so their lines count.
      #
      # Floor history: 79 -> 82 on 2026-08-16 (measured 85% local darwin,
      # no MLX, JIT on, minus 3 headroom). Left at 82 for the JIT-disabled
      # switch: local measurement is 93.3% but that includes the MLX layer
      # (~+5 points) this job can never see, and per the calibration
      # doctrine a ratchet needs a measurement under the gate's own
      # conditions -- take the first CI run's number, subtract headroom,
      # and ratchet then.
      - name: Run tests with coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        env:
          NUMBA_DISABLE_JIT: "1"
        run: uv run pytest tests/ --cov=pytcl --cov-report=xml --cov-fail-under=82 --benchmark-skip -m "not examples" -q

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false


  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Build docs (fail on any Sphinx error or warning)
        run: |
          uv run sphinx-build -b html docs /tmp/docs_build 2>&1 | tee /tmp/sphinx.log
          if grep -q "ERROR" /tmp/sphinx.log; then
            echo "::error::Sphinx build produced docutils ERRORs"
            grep "ERROR" /tmp/sphinx.log
            exit 1
          fi
          # The build is warning-free as of the docs cleanup. Gating on that
          # keeps it so: a broken cross-reference, a dead :doc: target or a
          # duplicated autodoc entry is a real defect, and 1225 of them had
          # accumulated behind a gate that only looked at ERRORs.
          count=$(grep -c "WARNING:" /tmp/sphinx.log || true)
          if [ "$count" -ne 0 ]; then
            echo "::error::Sphinx build produced $count warning(s); the docs build must stay warning-free"
            grep "WARNING:" /tmp/sphinx.log
            exit 1
          fi

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        # Install what a user installing the package would get, so the
        # examples exercise the real dependency set.
        run: uv sync --locked --extra all

      - name: Cache JPL ephemeris kernel
        # ephemeris_demo.py downloads DE440 (~114 MB) from naif.jpl.nasa.gov
        # on first use; a NASA-side timeout turns into a red examples job
        # (it did on 2026-08-11). Cache the kernel so the download happens
        # once per cache lifetime, not once per run.
        uses: actions/cache@v4
        with:
          path: ~/.jplephem
          key: jplephem-de440

      - name: Run every example script
        # PYTCL_SHOW_PLOTS=0 is set by the test itself, which also blocks
        # fig.show() outright so an unguarded call fails rather than silently
        # doing nothing in a headless container.
        run: uv run pytest tests/contract/test_examples.py tests/contract/test_tutorials.py tests/contract/test_docs_code_blocks.py -m examples -v --timeout=600

  notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        # matplotlib comes with the dev group, which uv sync installs by default
        run: uv sync --locked --extra visualization

      - name: Install Jupyter kernel
        run: |
          uv run python -m ipykernel install --user --name pytcl --display-name "Python (pytcl)"

      - name: Generate sample datasets
        run: |
          uv run python examples/data/generate_datasets.py

      - name: Validate notebooks (syntax check)
        run: |
          # Check that notebooks are valid JSON and can be parsed
          uv run python -c "
          import json
          from pathlib import Path
          notebooks = list(Path('docs/notebooks').glob('*.ipynb'))
          print(f'Found {len(notebooks)} notebooks')
          for nb in notebooks:
              with open(nb) as f:
                  data = json.load(f)
              print(f'  ✓ {nb.name}: {len(data.get(\"cells\", []))} cells')
          "

      - name: Run notebook validation (nbval-lax)
        run: |
          # nbval-lax executes every cell and fails on any error. The trailing
          # "|| echo" that used to be here swallowed the exit code, so this job
          # reported success while 13 cells were broken -- do not reintroduce it.
          uv run pytest --nbval-lax docs/notebooks/ -v --timeout=300
