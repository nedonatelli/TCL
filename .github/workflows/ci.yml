name: CI

on:
  push:
    branches: [main, develop, v2.0.0]
  pull_request:
    branches: [main, v2.0.0]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.16.0 mypy==2.3.0 numpy

      - name: Lint with ruff
        run: ruff check .

      - name: Check formatting with ruff
        run: ruff format --check .

      - name: Type check with mypy
        # --strict, not just --ignore-missing-imports. The looser command had
        # been passing while 12 strict errors accumulated in pytcl/io: missing
        # annotations on __enter__/__exit__, bare NDArray and bare tuple.
        run: mypy pytcl --strict --ignore-missing-imports

  doctests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with all extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]" pytest pytest-timeout

      - name: Run docstring examples
        # Doctests must not reach the network. A DEEphemeris example without a
        # "# doctest: +SKIP" tries to fetch the 114 MB DE440 kernel from
        # naif.jpl.nasa.gov and hung this job for ten minutes before timing
        # out; the per-test timeout turns any repeat into a fast, clear failure.
        run: pytest --doctest-modules pytcl -q --timeout=60

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Coverage runs on exactly one job -- the one that uploads it. Measured
      # on this suite, tracing costs 1.77x (81s -> 144s), and the other eight
      # jobs were paying it to produce a report that is thrown away. Those
      # eight run in parallel instead; -n auto is safe here because the suite
      # has no ordering dependence (verified: 5920 passed under xdist).
      #
      # The examples marker is excluded and runs in its own job: the scripts
      # are slow and only need exercising on one platform.
      # xdist everywhere except Windows. Measured on this suite: ubuntu-3.10
      # 430s -> 235s and macos-3.10 412s -> 193s, but windows-3.10 1252s ->
      # 1691s. Windows has no fork, so each worker spawns a fresh interpreter
      # and re-imports numpy, scipy and numba; with 2-4 runner cores that
      # startup cost exceeds the parallelism and swamps what dropping coverage
      # saved. Windows still gets the coverage saving, serially.
      - name: Run tests
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11') && matrix.os != 'windows-latest' }}
        run: pytest tests/ -n auto --benchmark-skip -m "not examples" -q

      - name: Run tests (Windows, serial)
        if: matrix.os == 'windows-latest'
        run: pytest tests/ --benchmark-skip -m "not examples" -q

      # Serial, because coverage under xdist has to merge per-worker data and
      # the gate is not worth the flakiness for one job.
      - name: Run tests with coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: pytest tests/ --cov=pytcl --cov-report=xml --cov-fail-under=79 --benchmark-skip -m "not examples" -q

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false


  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build docs (fail on any Sphinx error or warning)
        run: |
          pip install sphinx-rtd-theme nbsphinx sphinxcontrib-mermaid
          sphinx-build -b html docs /tmp/docs_build 2>&1 | tee /tmp/sphinx.log
          if grep -q "ERROR" /tmp/sphinx.log; then
            echo "::error::Sphinx build produced docutils ERRORs"
            grep "ERROR" /tmp/sphinx.log
            exit 1
          fi
          # The build is warning-free as of the docs cleanup. Gating on that
          # keeps it so: a broken cross-reference, a dead :doc: target or a
          # duplicated autodoc entry is a real defect, and 1225 of them had
          # accumulated behind a gate that only looked at ERRORs.
          count=$(grep -c "WARNING:" /tmp/sphinx.log || true)
          if [ "$count" -ne 0 ]; then
            echo "::error::Sphinx build produced $count warning(s); the docs build must stay warning-free"
            grep "WARNING:" /tmp/sphinx.log
            exit 1
          fi

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install what a user installing the package would get, so the
          # examples exercise the real dependency set.
          pip install -e ".[all]"

      - name: Run every example script
        # PYTCL_SHOW_PLOTS=0 is set by the test itself, which also blocks
        # fig.show() outright so an unguarded call fails rather than silently
        # doing nothing in a headless container.
        run: pytest tests/contract/test_examples.py -m examples -v --timeout=600

  notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The notebooks plot with plotly, which lives in the [visualization]
          # extra. Installing only [dev] left it missing, and the swallowed
          # exit code below hid the resulting ModuleNotFoundError in every
          # notebook -- install what the notebooks actually import.
          pip install -e ".[dev,visualization]"
          pip install matplotlib

      - name: Install Jupyter kernel
        run: |
          python -m ipykernel install --user --name pytcl --display-name "Python (pytcl)"

      - name: Generate sample datasets
        run: |
          python examples/data/generate_datasets.py

      - name: Validate notebooks (syntax check)
        run: |
          # Check that notebooks are valid JSON and can be parsed
          python -c "
          import json
          from pathlib import Path
          notebooks = list(Path('docs/notebooks').glob('*.ipynb'))
          print(f'Found {len(notebooks)} notebooks')
          for nb in notebooks:
              with open(nb) as f:
                  data = json.load(f)
              print(f'  ✓ {nb.name}: {len(data.get(\"cells\", []))} cells')
          "

      - name: Run notebook validation (nbval-lax)
        run: |
          # nbval-lax executes every cell and fails on any error. The trailing
          # "|| echo" that used to be here swallowed the exit code, so this job
          # reported success while 13 cells were broken -- do not reintroduce it.
          pytest --nbval-lax docs/notebooks/ -v --timeout=300
