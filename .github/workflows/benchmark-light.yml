name: Benchmark (Light)

on:
  pull_request:
    branches: [main, develop, v2.0.0]
    paths:
      - 'pytcl/**'
      - 'benchmarks/**'
      - '.github/workflows/benchmark-light.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  benchmark-light:
    runs-on: ubuntu-latest
    # Six files below at ~2 min/file worst case, plus checkout/install/sync
    # overhead; measured combined run of all six is ~220s on an Apple M3 Max
    # (2026-08-17) -- ubuntu-latest runners tend to be slower, so this leaves
    # headroom rather than matching that figure exactly.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # File list must be kept in sync with @pytest.mark.light usage: a file
      # only runs here if it's listed AND its tests carry the light marker.
      # Placement rule (see benchmarks/conftest.py's pytest_configure for the
      # full rationale): a file is wired in here only if its whole `-m light`
      # run fits a ~2-minute-per-file budget. Measured per-file (Apple M3 Max,
      # 2026-08-17, `--benchmark-only --benchmark-warmup=on
      # --benchmark-min-rounds=100`): test_kalman_bench.py+test_gating_bench.py
      # +test_rotations_bench.py+test_cubature_bench.py combined ~72s;
      # test_signal_processing_bench.py ~57s; test_special_functions_bench.py
      # ~89s -- all fit and are wired below. test_track_management_bench.py
      # measured ~130s, over budget, so its tests are marked
      # @pytest.mark.full instead and it is deliberately NOT listed here (it
      # still runs nightly/on-main via benchmark-full.yml).
      - name: Run light benchmarks
        run: |
          uv run pytest benchmarks/test_kalman_bench.py \
                           benchmarks/test_gating_bench.py \
                           benchmarks/test_rotations_bench.py \
                           benchmarks/test_cubature_bench.py \
                           benchmarks/test_special_functions_bench.py \
                           benchmarks/test_signal_processing_bench.py \
            --benchmark-only \
            --benchmark-json=/tmp/benchmark_results.json \
            --benchmark-warmup=on \
            --benchmark-min-rounds=100 \
            -m "light" \
            -q

      - name: Check for regressions
        run: |
          uv run python scripts/detect_regressions.py /tmp/benchmark_results.json \
            --slos .benchmarks/slos.json \
            --history .benchmarks/history.jsonl

      - name: Generate SLO compliance report
        if: always() && github.event_name == 'pull_request'
        id: benchmark-summary
        run: |
          uv run python scripts/generate_slo_report.py /tmp/benchmark_results.json \
            --slos .benchmarks/slos.json \
            --format markdown \
            -o /tmp/summary.md

          echo "summary<<BENCH_SUMMARY_EOF" >> $GITHUB_OUTPUT
          cat /tmp/summary.md >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "BENCH_SUMMARY_EOF" >> $GITHUB_OUTPUT

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('/tmp/summary.md', 'utf8');

            // Find existing comment
            const comments = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo
            });

            const botComment = comments.data.find(c =>
              c.user.type === 'Bot' && c.body.includes('Benchmark Results (Light)')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                comment_id: botComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: summary
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: summary
              });
            }
