name: Benchmark (Full)

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:

permissions:
  contents: write

# Serialise runs: this job commits benchmark history back to main, and two
# concurrent runs will race on the push. Queue rather than cancel, so a run
# triggered by a second merge still records its results.
concurrency:
  group: benchmark-full-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark-full:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for tracking

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run full benchmark suite
        run: |
          uv run pytest benchmarks/ \
            --benchmark-only \
            --benchmark-json=/tmp/benchmark_results.json \
            --benchmark-warmup=on \
            --benchmark-min-rounds=100 \
            -v

      - name: Check SLO compliance
        run: |
          uv run python scripts/detect_regressions.py /tmp/benchmark_results.json \
            --slos .benchmarks/slos.json \
            --history .benchmarks/history.jsonl \
            --strict

      - name: Track performance
        if: github.ref == 'refs/heads/main'
        # --results parses the suite's own output (no second benchmark
        # run) and builds history rows in track_performance.py's one
        # record shape -- real params, hd15iqr_ms included. This step
        # previously re-ran the whole suite for a summary and appended
        # via an inline duplicate record dict that hardcoded
        # params='default' and silently dropped new fields.
        run: |
          uv run python scripts/track_performance.py \
            --results /tmp/benchmark_results.json \
            --history .benchmarks/history.jsonl

      - name: Commit history update
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .benchmarks/history.jsonl
          git diff --staged --quiet || git commit -m "chore: Update benchmark history [skip ci]"
          # Two pushes to main in quick succession start two of these runs, and
          # whichever commits second is rejected non-fast-forward. The history
          # file is append-only; .gitattributes marks it merge=union so the
          # rebase self-resolves the append-append conflict. The abort guard
          # clears any half-finished rebase so a failed attempt cannot poison
          # the next one (that exact failure ate all three retries once).
          for attempt in 1 2 3; do
            git rebase --abort >/dev/null 2>&1 || true
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push attempt $attempt was beaten to it; retrying"
            sleep 5
          done
          echo "::error::could not push benchmark history after 3 attempts"
          exit 1

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: /tmp/benchmark_results.json
          retention-days: 30

      - name: Generate SLO compliance report
        if: always()
        run: |
          uv run python scripts/generate_slo_report.py /tmp/benchmark_results.json \
            --slos .benchmarks/slos.json \
            --history .benchmarks/history.jsonl \
            --format markdown \
            --include-trends \
            -o /tmp/report.md

          cat /tmp/report.md >> $GITHUB_STEP_SUMMARY

      - name: Save compliance report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slo-compliance-report
          path: /tmp/report.md
          retention-days: 30
